<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    {{ROBOTS_META}}
    <title>{{TITLE}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:type" content="{{OG_TYPE}}">
    <meta property="og:site_name" content="{{OG_SITE_NAME}}">
    <meta property="og:locale" content="{{OG_LOCALE}}">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TWITTER_TITLE}}">
    <meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}">
    <meta name="twitter:image" content="{{TWITTER_IMAGE}}">
    {{JSON_LD}}

    <!-- Lean landing shell: no Tailwind CDN, no icon library, no main.js.
         All CSS/JS is inlined at build time from scripts/templates/landing.css
         and scripts/templates/landing.js — keep them small. -->
    <style>{{INLINE_CSS}}</style>

    <!-- Meta Pixel ID (numbers only). Events stay disabled if this starts
         with "REPLACE". Must match the ID in the <noscript> fallback below. -->
    <script>window.META_PIXEL_ID = '896556959557749';</script>

    <link rel="preconnect" href="https://connect.facebook.net" crossorigin>
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin>
</head>
<body class="landing">
    <!-- Meta Pixel no-JS fallback — ID must match window.META_PIXEL_ID above -->
    <noscript><img height="1" width="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=896556959557749&amp;ev=PageView&amp;noscript=1"
    /></noscript>
{{BODY_HTML}}
    <script>{{INLINE_JS}}</script>
</body>
</html>
